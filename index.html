<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的行程表</title>

<style>

:root {
    --bg: #fff5e0;
    --card: #e3dfdc;
    --button: #1a0b08;
    --text: #241b18;
    --muted: #756b66;
    --line: #cfc7c1;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
}

.app {
    width: 100%;
    max-width: 720px;
    margin: auto;
    padding: 24px 16px 100px;
}

/* 上方標題 */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.date-title {
    font-size: 24px;
    font-weight: 800;
}

.subtitle {
    margin-top: 5px;
    font-size: 13px;
    color: var(--muted);
}

/* 日期切換 */

.navigation {
    display: flex;
    gap: 7px;
}

.navigation button {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 12px;
    background: var(--button);
    color: white;
    font-size: 23px;
    cursor: pointer;
}

/* 分類 */

.tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    padding: 4px;
    margin-bottom: 20px;
    background: #eee6db;
    border-radius: 14px;
}

.tabs button {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 9px 3px;
    border-radius: 10px;
    cursor: pointer;
}

.tabs .active {
    background: var(--card);
    color: var(--text);
    font-weight: 800;
}

/* 時段標題 */

.period {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px 0 10px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
}

.period::after {
    content: "";
    height: 1px;
    background: var(--line);
    flex: 1;
}

/* 行程卡片 */

.card {
    position: relative;
    margin: 9px 0;
    padding: 14px 55px 14px 14px;
    background: var(--card);
    border-radius: 18px;
    border: 1px solid rgba(150,140,133,.28);
    box-shadow: 0 3px 12px rgba(70,55,45,.08);
    cursor: pointer;
}

.card.done {
    opacity: .5;
}

.card.done .title {
    text-decoration: line-through;
}

.card-number {
    float: left;
    width: 28px;
    color: #8a807a;
    font-size: 12px;
    font-weight: 800;
    padding-top: 2px;
}

.card-content {
    margin-left: 38px;
}

.time {
    font-size: 13px;
    font-weight: 800;
}

.title {
    margin-top: 3px;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.45;
}

.description {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.55;
}

/* 完成按鈕 */

.check-button {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);

    width: 29px;
    height: 29px;

    border-radius: 9px;
    border: 2px solid #9c918a;

    background: transparent;
    color: white;

    font-size: 16px;
    font-weight: 800;

    cursor: pointer;
}

.check-button.checked {
    background: var(--button);
    border-color: var(--button);
}

/* 新增按鈕 */

.add-button {
    position: fixed;
    right: 20px;
    bottom: 20px;

    width: 56px;
    height: 56px;

    border: none;
    border-radius: 18px;

    background: var(--button);
    color: white;

    font-size: 28px;

    box-shadow: 0 8px 22px rgba(26,11,8,.22);

    cursor: pointer;
}

/* 編輯視窗 */

.modal-background {
    position: fixed;
    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(30,20,15,.45);

    z-index: 100;
}

.modal-background.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 460px;

    background: #fff5e0;

    border-radius: 22px;

    padding: 22px;

    box-shadow: 0 15px 45px rgba(30,20,15,.25);
}

.modal h2 {
    margin: 0 0 20px;
    font-size: 21px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;

    font-size: 13px;
    font-weight: 700;
}

.form-group input,
.form-group textarea {
    width: 100%;

    border: 1px solid #cfc7c1;
    border-radius: 12px;

    background: white;

    padding: 11px;

    font: inherit;
    color: var(--text);

    outline: none;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.modal-buttons {
    display: flex;
    gap: 8px;
    margin-top: 20px;
}

.modal-buttons button {
    flex: 1;

    border: none;
    border-radius: 12px;

    padding: 12px;

    font-weight: 700;
    cursor: pointer;
}

.cancel-button {
    background: #e3dfdc;
    color: var(--text);
}

.save-button {
    background: var(--button);
    color: white;
}

.delete-button {
    background: #d8cbc6;
    color: #3a211b;
}

/* 手機版 */

@media (max-width: 420px) {

    .app {
        padding: 18px 13px 100px;
    }

    .date-title {
        font-size: 21px;
    }

    .card {
        padding: 13px 51px 13px 12px;
        border-radius: 17px;
    }

    .card-content {
        margin-left: 35px;
    }

    .title {
        font-size: 15px;
    }

}

</style>
</head>


<body>

<div class="app">

    <div class="header">

        <div>
            <div class="date-title" id="dateTitle">
                我的行程
            </div>

            <div class="subtitle">
                列表模式
            </div>
        </div>

        <div class="navigation">

            <button onclick="previousDay()">‹</button>

            <button onclick="nextDay()">›</button>

        </div>

    </div>


    <div class="tabs">

        <button class="active">今天</button>

        <button>明天</button>

        <button>本週</button>

        <button>全部</button>

    </div>


    <div id="scheduleList"></div>


</div>


<button class="add-button" onclick="openAddModal()">
    ＋
</button>


<!-- 編輯視窗 -->

<div class="modal-background" id="modalBackground">

    <div class="modal">

        <h2 id="modalTitle">
            新增行程
        </h2>


        <div class="form-group">

            <label>
                時間
            </label>

            <input
                type="time"
                id="eventTime"
            >

        </div>


        <div class="form-group">

            <label>
                行程名稱
            </label>

            <input
                type="text"
                id="eventTitle"
                placeholder="例如：撰寫訪問大綱"
            >

        </div>


        <div class="form-group">

            <label>
                備註
            </label>

            <textarea
                id="eventDescription"
                placeholder="可以輸入行程備註"
            ></textarea>

        </div>


        <div class="modal-buttons">

            <button
                class="cancel-button"
                onclick="closeModal()"
            >
                取消
            </button>


            <button
                class="delete-button"
                id="deleteButton"
                onclick="deleteEvent()"
            >
                刪除
            </button>


            <button
                class="save-button"
                onclick="saveEvent()"
            >
                儲存
            </button>

        </div>

    </div>

</div>


<script>

/* -------------------------
   資料
------------------------- */

let events = JSON.parse(
    localStorage.getItem("myCalendarEvents")
) || [

    {
        id: 1,
        time: "09:00",
        title: "撰寫《三多有我在》訪問大綱",
        description: "確認訪問順序、補充追問題，整理給來賓版題綱",
        done: false
    },

    {
        id: 2,
        time: "10:30",
        title: "整理錄音檔",
        description: "確認檔名、剪除前後空白與明顯雜訊",
        done: false
    },

    {
        id: 3,
        time: "11:30",
        title: "錄音",
        description: "確認麥克風與錄音設定後開始錄製",
        done: false
    },

    {
        id: 4,
        time: "13:30",
        title: "修改節目口播稿",
        description: "檢查資訊正確性、斷句與口語表達",
        done: false
    },

    {
        id: 5,
        time: "15:00",
        title: "製作節目音效",
        description: "整理片頭、轉場與收尾音效",
        done: false
    },

    {
        id: 6,
        time: "16:30",
        title: "來賓訪問",
        description: "確認訪綱與錄音設備",
        done: false
    }

];


let editingId = null;


/* -------------------------
   儲存資料
------------------------- */

function saveToStorage() {

    localStorage.setItem(
        "myCalendarEvents",
        JSON.stringify(events)
    );

}


/* -------------------------
   顯示行程
------------------------- */

function renderEvents() {

    const list =
        document.getElementById("scheduleList");

    list.innerHTML = "";


    if (events.length === 0) {

        list.innerHTML = `
            <div style="
                text-align:center;
                padding:60px 20px;
                color:#756b66;
            ">
                今天沒有行程
            </div>
        `;

        return;

    }


    events.sort(
        (a,b) => a.time.localeCompare(b.time)
    );


    let period = "";


    events.forEach((event,index) => {

        let currentPeriod =
            event.time < "12:00"
            ? "上午作業"
            : "下午作業";


        if (currentPeriod !== period) {

            period = currentPeriod;

            const periodElement =
                document.createElement("div");

            periodElement.className = "period";

            periodElement.textContent =
                currentPeriod;

            list.appendChild(periodElement);

        }


        const card =
            document.createElement("div");

        card.className =
            "card" +
            (event.done ? " done" : "");


        card.innerHTML = `

            <div class="card-number">
                ${String(index + 1).padStart(2,"0")}
            </div>

            <div class="card-content">

                <div class="time">
                    ${event.time}
                </div>

                <div class="title">
                    ${escapeHtml(event.title)}
                </div>

                ${
                    event.description
                    ? `
                        <div class="description">
                            ${escapeHtml(event.description)}
                        </div>
                    `
                    : ""
                }

            </div>

            <button
                class="check-button ${event.done ? "checked" : ""}"
                onclick="toggleDone(event, ${event.id})"
            >
                ${event.done ? "✓" : ""}
            </button>

        `;


        card.addEventListener(
            "click",
            function(e) {

                if (
                    e.target.classList.contains(
                        "check-button"
                    )
                ) return;

                openEditModal(event.id);

            }
        );


        list.appendChild(card);

    });

}


/* -------------------------
   完成 / 取消完成
------------------------- */

function toggleDone(e,id) {

    e.stopPropagation();

    const event =
        events.find(item => item.id === id);

    if (!event) return;

    event.done = !event.done;

    saveToStorage();

    renderEvents();

}


/* -------------------------
   新增
------------------------- */

function openAddModal() {

    editingId = null;

    document.getElementById(
        "modalTitle"
    ).textContent = "新增行程";


    document.getElementById(
        "eventTime"
    ).value = "";


    document.getElementById(
        "eventTitle"
    ).value = "";


    document.getElementById(
        "eventDescription"
    ).value = "";


    document.getElementById(
        "deleteButton"
    ).style.display = "none";


    document.getElementById(
        "modalBackground"
    ).classList.add("show");

}


/* -------------------------
   編輯
------------------------- */

function openEditModal(id) {

    const event =
        events.find(item => item.id === id);

    if (!event) return;

    editingId = id;


    document.getElementById(
        "modalTitle"
    ).textContent = "編輯行程";


    document.getElementById(
        "eventTime"
    ).value = event.time;


    document.getElementById(
        "eventTitle"
    ).value = event.title;


    document.getElementById(
        "eventDescription"
    ).value = event.description;


    document.getElementById(
        "deleteButton"
    ).style.display = "block";


    document.getElementById(
        "modalBackground"
    ).classList.add("show");

}


/* -------------------------
   儲存
------------------------- */

function saveEvent() {

    const time =
        document.getElementById(
            "eventTime"
        ).value;


    const title =
        document.getElementById(
            "eventTitle"
        ).value.trim();


    const description =
        document.getElementById(
            "eventDescription"
        ).value.trim();


    if (!time || !title) {

        alert("請輸入時間和行程名稱");

        return;

    }


    if (editingId === null) {

        events.push({

            id: Date.now(),

            time: time,

            title: title,

            description: description,

            done: false

        });

    } else {

        const event =
            events.find(
                item => item.id === editingId
            );


        if (event) {

            event.time = time;

            event.title = title;

            event.description =
                description;

        }

    }


    saveToStorage();

    renderEvents();

    closeModal();

}


/* -------------------------
   刪除
------------------------- */

function deleteEvent() {

    if (editingId === null) return;


    const confirmed =
        confirm("確定要刪除這個行程嗎？");


    if (!confirmed) return;


    events =
        events.filter(
            item => item.id !== editingId
        );


    saveToStorage();

    renderEvents();

    closeModal();

}


/* -------------------------
   關閉視窗
------------------------- */

function closeModal() {

    document.getElementById(
        "modalBackground"
    ).classList.remove("show");

}


/* -------------------------
   日期切換
------------------------- */

function previousDay() {

    alert("下一階段會加入真正的日期切換功能。");

}


function nextDay() {

    alert("下一階段會加入真正的日期切換功能。");

}


/* -------------------------
   防止特殊文字破壞 HTML
------------------------- */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* -------------------------
   啟動
------------------------- */

renderEvents();

</script>

</body>
</html>
